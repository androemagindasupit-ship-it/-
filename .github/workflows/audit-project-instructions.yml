name: Inspect and validate uploaded project

on:
  push:
    branches:
      - "audit/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Safely unpack and inspect source archive
        id: inspect
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, stat, unicodedata, zipfile
          from pathlib import Path, PurePosixPath

          roots = [p for p in Path(".").iterdir() if p.is_file() and p.suffix.lower() == ".zip"]
          print("REPOSITORY_TOP_LEVEL:")
          for p in sorted(Path(".").iterdir(), key=lambda p: p.name.casefold()):
              print(("DIR " if p.is_dir() else "FILE ") + p.name)
          if len(roots) != 1:
              raise SystemExit(f"Expected exactly one top-level ZIP archive, found {len(roots)}")
          archive = roots[0]
          out = Path(os.environ["RUNNER_TEMP"]) / "uploaded-project"
          out.mkdir(parents=True, exist_ok=True)

          MAX_ENTRIES, MAX_TOTAL, MAX_SINGLE = 50000, 500 * 1024 * 1024, 150 * 1024 * 1024
          total, count = 0, 0
          instructions, all_names = [], []
          def normalize(s):
              s = unicodedata.normalize("NFKC", s).casefold()
              return "".join(ch for ch in s if ch.isalnum())
          def is_instruction(p):
              name = normalize(PurePosixPath(p).name)
              return PurePosixPath(p).suffix.casefold() == ".txt" and (
                  "معلوماتالتطبيق" in name or "نصملصق" in name
              )
          with zipfile.ZipFile(archive) as zf:
              infos = zf.infolist()
              if len(infos) > MAX_ENTRIES:
                  raise SystemExit(f"Archive contains too many entries: {len(infos)}")
              for info in infos:
                  if info.is_dir():
                      continue
                  count += 1
                  total += info.file_size
                  all_names.append(info.filename)
                  if info.file_size > MAX_SINGLE or total > MAX_TOTAL:
                      raise SystemExit("Archive exceeds safety limits; no files extracted.")
                  path = PurePosixPath(info.filename)
                  if path.is_absolute() or ".." in path.parts:
                      print("SKIP_UNSAFE_PATH:", info.filename)
                      continue
                  mode = (info.external_attr >> 16) & 0o170000
                  if mode == stat.S_IFLNK:
                      print("SKIP_SYMLINK:", info.filename)
                      continue
                  target = out.joinpath(*path.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  if is_instruction(info.filename):
                      try:
                          raw = zf.read(info)
                          try: decoded = raw.decode("utf-8-sig")
                          except UnicodeDecodeError: decoded = raw.decode("cp1256", errors="replace")
                          instructions.append((info.filename, decoded))
                      except Exception as exc:
                          instructions.append((info.filename, f"[READ ERROR: {type(exc).__name__}]"))
                  try:
                      with zf.open(info) as src, target.open("wb") as dst:
                          while True:
                              chunk = src.read(1024 * 1024)
                              if not chunk: break
                              dst.write(chunk)
                  except Exception as exc:
                      print("EXTRACTION_ERROR:", info.filename, type(exc).__name__)
                      raise
          print(f"ARCHIVE: {archive.name}; FILES: {count}; DECLARED_UNCOMPRESSED_BYTES: {total}")
          print("\nARCHIVE_PATHS (up to 2500):")
          for name in all_names[:2500]: print(name)
          print("\nINSTRUCTION_FILES_FOUND:", len(instructions))
          for name, body in instructions:
              print("\n" + "=" * 24 + " " + name + " " + "=" * 24)
              print(body)
              print("=" * 70)
          if not instructions:
              print("NOTICE: Neither requested instructions filename was present in the uploaded archive.")

          candidates = []
          for base, dirs, files in os.walk(out):
              dirs[:] = [d for d in dirs if d not in {"node_modules", ".git", "dist", "build", ".gradle"}]
              here = Path(base)
              score = 0
              if "pnpm-workspace.yaml" in files: score += 100
              if "pnpm-lock.yaml" in files and "package.json" in files: score += 60
              if "package.json" in files: score += 10
              if "gradlew" in files: score += 8
              if "settings.gradle" in files or "settings.gradle.kts" in files: score += 5
              if "vite.config.ts" in files or "vite.config.js" in files: score += 2
              if "README.md" in files or "readme.md" in files: score += 1
              if score: candidates.append((score, -len(here.parts), here))
          project = max(candidates, default=(0, 0, out), key=lambda t: (t[0], t[1]))[2]
          print("\nDETECTED_WORKSPACE_ROOT:", project)
          print("WORKSPACE_ROOT_FILES:")
          for p in sorted(project.iterdir(), key=lambda p: p.name.casefold())[:500]:
              print(("DIR " if p.is_dir() else "FILE ") + p.name)

          safe_names = {
              "package.json", "readme.md", "readme", "build.md", "database.md",
              "engineering_progress_report.md", "project_audit.md", "setup.md",
              "deployment.md", "auth_setup.md", "replit.md", "capacitor.config.json",
              "capacitor.config.ts", "capacitor.config.js", "vite.config.ts", "vite.config.js",
              "next.config.js", "next.config.mjs", "next.config.ts", "angular.json",
              "manifest.json", "app.json", "pubspec.yaml", "requirements.txt",
              "pyproject.toml", "settings.gradle", "settings.gradle.kts", "build.gradle",
              "build.gradle.kts", "gradle-wrapper.properties", "pom.xml", "pnpm-workspace.yaml",
              "tsconfig.json", "tsconfig.base.json",
          }
          sensitive_key = re.compile(r"(secret|token|password|passwd|credential|private.?key|api.?key|client.?secret)", re.I)
          def redact(obj):
              if isinstance(obj, dict):
                  return {k: ("[REDACTED]" if sensitive_key.search(str(k)) else redact(v)) for k, v in obj.items()}
              if isinstance(obj, list): return [redact(x) for x in obj]
              return obj
          print("\nKEY_MANIFESTS_AND_DOCUMENTATION:")
          printed = 0
          for p in sorted(project.rglob("*"), key=lambda p: str(p).casefold()):
              if not p.is_file() or any(part in {"node_modules", ".git", "dist", "build", ".gradle"} for part in p.parts):
                  continue
              if p.name.casefold() not in safe_names: continue
              if p.stat().st_size > 128 * 1024:
                  print(f"SKIP_LARGE_MANIFEST: {p.relative_to(project)} ({p.stat().st_size} bytes)")
                  continue
              data = p.read_text(encoding="utf-8", errors="replace")
              if p.name.casefold() == "package.json":
                  try: data = json.dumps(redact(json.loads(data)), ensure_ascii=False, indent=2)
                  except Exception: data = "[package.json is not valid JSON]"
              data = re.sub(r'(?im)^([ \t]*[^\n=]*(?:secret|token|password|api[_-]?key|private[_-]?key)[^\n=]*[=:][ \t]*)([^\n]+)', r'\1[REDACTED]', data)
              print(f"--- {p.relative_to(project)} ---")
              print(data[:20000])
              printed += 1
              if printed >= 60:
                  print("MANIFEST_OUTPUT_TRUNCATED_AFTER_60_FILES")
                  break
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("PROJECT_ROOT=" + str(project) + "\n")
          PY

      - name: Upload inspected source for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspected-project-source
          path: ${{ runner.temp }}/uploaded-project/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Prepare existing app for Capacitor without replacing current source
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/prepare-android-build-v3.py" "$PROJECT_ROOT"
          ARCHIVE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$ARCHIVE"
          echo "SOURCE_ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          test -s "$PROJECT_ROOT/artifacts/barakat-chemistry/capacitor.config.ts"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve existing lockfile drift and verify frozen install
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          corepack enable
          corepack prepare pnpm@10.26.1 --activate
          pnpm install --no-frozen-lockfile
          pnpm install --frozen-lockfile

      - name: Run current project checks and compile frontend/API
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          node scripts/check-project.mjs
          pnpm run typecheck
          pnpm run build
          pnpm --filter @workspace/barakat-chemistry run build
          pnpm --filter @workspace/api-server run build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Build and validate Android debug APK
        id: build_apk
        shell: bash
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_CLERK_PROXY_URL: ${{ vars.VITE_CLERK_PROXY_URL }}
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          cd "$PROJECT_ROOT/artifacts/barakat-chemistry"
          if [ -n "$VITE_API_BASE_URL" ] && [ -n "$VITE_CLERK_PUBLISHABLE_KEY" ]; then
            export VITE_MOBILE_PREVIEW=false
            echo "Build mode: service-configured (no configuration values printed)."
          else
            export VITE_MOBILE_PREVIEW=true
            echo "Build mode: public-only preview; auth/student operations disabled because service configuration is unavailable."
          fi
          pnpm run build
          if [ ! -d android ]; then
            pnpm exec cap add android
          fi
          pnpm exec cap sync android
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          APK="$PROJECT_ROOT/artifacts/barakat-chemistry/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          sha256sum "$APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          if [ -x "$ANDROID_HOME/build-tools/36.0.0/aapt" ]; then
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 8
          elif command -v aapt >/dev/null 2>&1; then
            aapt dump badging "$APK" | head -n 8
          else
            echo "ERROR: APK built but aapt validation tool is unavailable."
            exit 1
          fi

      - name: Upload real Android APK artifact
        if: always() && steps.build_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: barakat-chemistry-debug-apk
          path: ${{ steps.build_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Repack tested source into the original ZIP and push a commit
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, zipfile
          from pathlib import Path

          project = Path(os.environ["PROJECT_ROOT"]).resolve()
          archive = Path(os.environ["SOURCE_ARCHIVE"]).resolve()
          replacement = archive.with_name(archive.stem + ".validated.zip")
          excluded = {"node_modules", ".git", "dist", "build", ".gradle", ".turbo", "coverage"}
          count = 0
          with zipfile.ZipFile(replacement, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=7) as output:
              for path in sorted(project.rglob("*"), key=lambda p: str(p).casefold()):
                  if path.is_dir():
                      continue
                  relative = path.relative_to(project)
                  if any(part in excluded for part in relative.parts):
                      continue
                  if path.name == ".env" or (path.name.startswith(".env.") and path.name != ".env.example"):
                      continue
                  if path.suffix.lower() in {".keystore", ".jks", ".p12", ".pem", ".apk", ".aab"}:
                      continue
                  if path.name.endswith(".log"):
                      continue
                  output.write(path, project.name + "/" + relative.as_posix())
                  count += 1
          if count < 200:
              raise SystemExit(f"Refusing archive replacement: only {count} files selected.")
          with zipfile.ZipFile(replacement) as output:
              bad = output.testzip()
              if bad:
                  raise SystemExit(f"Repacked ZIP integrity error: {bad}")
          print("Repacked source entries:", count)
          os.replace(replacement, archive)
          PY
          git status --short
          git diff --stat -- "$SOURCE_ARCHIVE"
          git add -- "$SOURCE_ARCHIVE"
          git diff --cached --check
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Repair Barakat app and add Android APK support [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload source snapshot for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: barakat-project-audit-source
          path: ${{ runner.temp }}/uploaded-project/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
